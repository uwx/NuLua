name: Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '11.0.x'
          cache: true
          cache-dependency-path: '**/*.csproj'
      - name: Resolve version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - name: Verify version matches Directory.Build.props
        run: |
          TAG_VERSION="${{ steps.version.outputs.version }}"
          PROP_VERSION=$(sed -n 's/.*<PackageVersion>\([^<]*\)<\/PackageVersion>.*/\1/p' Directory.Build.props)
          if [ "$TAG_VERSION" != "$PROP_VERSION" ]; then
            echo "Version mismatch: tag=v$TAG_VERSION, Directory.Build.props=$PROP_VERSION"
            exit 1
          fi
          echo "Version verified: $TAG_VERSION"
      - name: Restore
        run: dotnet restore NuLua.slnx
      - name: Build
        run: dotnet build NuLua.slnx --no-restore -c Release -p:PackageVersion=${{ steps.version.outputs.version }}
      - name: Pack
        run: dotnet pack NuLua.slnx --no-build -c Release -p:PackageVersion=${{ steps.version.outputs.version }} -o ./artifacts
      - name: NuGet login
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: nuskey
      - name: Push to NuGet
        run: dotnet nuget push "./artifacts/*.nupkg" --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes \
            ./artifacts/*.nupkg
