name: Build-Native-Lua55

# Cross-compiles the lua55 shared library for the six desktop RIDs and opens a PR that
# places the artifacts under src/NuLua.Runtime.Lua55/runtimes/{rid}/native/.

on:
  workflow_dispatch:

env:
  FLAVOR: lua55
  DISPLAY: Lua55

jobs:
  build-windows:
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            arch: x86_64
          - rid: win-arm64
            arch: aarch64
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install llvm-mingw
        shell: bash
        run: |
          set -euo pipefail
          ver=20240917
          curl -fL -o llvm-mingw.zip \
            "https://github.com/mstorsjo/llvm-mingw/releases/download/${ver}/llvm-mingw-${ver}-ucrt-x86_64.zip"
          unzip -q llvm-mingw.zip -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/llvm-mingw-${ver}-ucrt-x86_64/bin" >> "$GITHUB_PATH"
      - name: Build via make
        shell: bash
        working-directory: native
        run: |
          make ${{ env.FLAVOR }} \
            RID=${{ matrix.rid }} \
            TARGET_OS=windows \
            CC=${{ matrix.arch }}-w64-mingw32-gcc \
            AR=${{ matrix.arch }}-w64-mingw32-ar \
            RANLIB=${{ matrix.arch }}-w64-mingw32-ranlib
      - name: Stage artifact
        shell: bash
        working-directory: native
        run: |
          mkdir -p ../artifacts/${{ matrix.rid }}
          cp build/${{ env.FLAVOR }}/${{ matrix.rid }}/${{ env.FLAVOR }}.dll ../artifacts/${{ matrix.rid }}/
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.FLAVOR }}-${{ matrix.rid }}
          path: artifacts/${{ matrix.rid }}/

  build-linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: linux-x64
            cc_prefix: ""
            packages: ""
          - rid: linux-arm64
            cc_prefix: "aarch64-linux-gnu-"
            packages: gcc-aarch64-linux-gnu
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install cross-compiler
        if: ${{ matrix.packages != '' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ matrix.packages }}
      - name: Build via make
        working-directory: native
        run: |
          make ${{ env.FLAVOR }} \
            RID=${{ matrix.rid }} \
            TARGET_OS=linux \
            CC=${{ matrix.cc_prefix }}gcc \
            AR=${{ matrix.cc_prefix }}ar \
            RANLIB=${{ matrix.cc_prefix }}ranlib
      - name: Stage artifact
        working-directory: native
        run: |
          mkdir -p ../artifacts/${{ matrix.rid }}
          cp build/${{ env.FLAVOR }}/${{ matrix.rid }}/lib${{ env.FLAVOR }}.so ../artifacts/${{ matrix.rid }}/
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.FLAVOR }}-${{ matrix.rid }}
          path: artifacts/${{ matrix.rid }}/

  build-macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: osx-x64
            arch: x86_64
          - rid: osx-arm64
            arch: arm64
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Build via make
        working-directory: native
        run: |
          make ${{ env.FLAVOR }} \
            RID=${{ matrix.rid }} \
            TARGET_OS=macos \
            CC=clang \
            AR=ar \
            RANLIB=ranlib \
            CFLAGS_EXTRA="-arch ${{ matrix.arch }}"
      - name: Stage artifact
        working-directory: native
        run: |
          mkdir -p ../artifacts/${{ matrix.rid }}
          cp build/${{ env.FLAVOR }}/${{ matrix.rid }}/lib${{ env.FLAVOR }}.dylib ../artifacts/${{ matrix.rid }}/
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.FLAVOR }}-${{ matrix.rid }}
          path: artifacts/${{ matrix.rid }}/

  create-pr:
    needs: [build-windows, build-linux, build-macos]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    env:
      BRANCH: automate/${{ github.run_id }}-${{ github.run_attempt }}-lua55
    steps:
      - uses: actions/checkout@v4
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Configure git
        run: |
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
      - name: Create branch
        run: git checkout -b "${BRANCH}"
      - name: Place artifacts under runtimes/
        env:
          DEST_BASE: src/NuLua.Runtime.${{ env.DISPLAY }}/runtimes
        run: |
          set -euo pipefail
          for rid in win-x64 win-arm64 linux-x64 linux-arm64 osx-x64 osx-arm64; do
            mkdir -p "${DEST_BASE}/${rid}/native"
          done

          # Windows
          for rid in win-x64 win-arm64; do
            src="artifacts/${FLAVOR}-${rid}/${FLAVOR}.dll"
            [ -f "$src" ] && cp -f "$src" "${DEST_BASE}/${rid}/native/${FLAVOR}.dll"
          done

          # Linux
          for rid in linux-x64 linux-arm64; do
            src="artifacts/${FLAVOR}-${rid}/lib${FLAVOR}.so"
            [ -f "$src" ] && cp -f "$src" "${DEST_BASE}/${rid}/native/lib${FLAVOR}.so"
          done

          # macOS
          for rid in osx-x64 osx-arm64; do
            src="artifacts/${FLAVOR}-${rid}/lib${FLAVOR}.dylib"
            [ -f "$src" ] && cp -f "$src" "${DEST_BASE}/${rid}/native/lib${FLAVOR}.dylib"
          done

          git add "${DEST_BASE}"
          git commit -m "automate: refresh ${FLAVOR} native binaries"
      - name: Push and open PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git push origin "${BRANCH}"
          gh pr create \
            --title "automate: refresh ${FLAVOR} native binaries" \
            --base main \
            --head "${BRANCH}" \
            --body "Refreshes ${FLAVOR} native binaries for win/linux/osx (x64+arm64) under \`src/NuLua.Runtime.${DISPLAY}/runtimes/\`."
