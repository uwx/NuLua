name: Build-Native

# Builds all 7 Lua flavors (lua51..lua55, luau, luajit) for the six desktop
# RIDs via the root Makefile and opens a single PR placing each artifact under
# src/NuLua.Runtime.{Display}/runtimes/{rid}/native/.

on:
  workflow_dispatch:

jobs:
  build-windows:
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            arch: x86_64
          - rid: win-arm64
            arch: aarch64
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install llvm-mingw
        shell: bash
        run: |
          set -euo pipefail
          ver=20240917
          curl -fL -o llvm-mingw.zip \
            "https://github.com/mstorsjo/llvm-mingw/releases/download/${ver}/llvm-mingw-${ver}-ucrt-x86_64.zip"
          unzip -q llvm-mingw.zip -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/llvm-mingw-${ver}-ucrt-x86_64/bin" >> "$GITHUB_PATH"
      - name: Build via make
        shell: bash
        working-directory: native
        run: |
          make all \
            RID=${{ matrix.rid }} \
            TARGET_OS=windows \
            CC=${{ matrix.arch }}-w64-mingw32-gcc \
            CXX=${{ matrix.arch }}-w64-mingw32-g++ \
            AR=${{ matrix.arch }}-w64-mingw32-ar \
            RANLIB=${{ matrix.arch }}-w64-mingw32-ranlib \
            HOST_CC=x86_64-w64-mingw32-gcc \
            CROSS=${{ matrix.arch }}-w64-mingw32-
      - name: Stage artifacts
        shell: bash
        working-directory: native
        run: |
          set -euo pipefail
          mkdir -p ../artifacts/${{ matrix.rid }}
          for f in lua51 lua52 lua53 lua54 lua55 luau luajit; do
            cp build/${f}/${{ matrix.rid }}/${f}.dll ../artifacts/${{ matrix.rid }}/
          done
      - uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.rid }}
          path: artifacts/${{ matrix.rid }}/

  build-linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: linux-x64
            cc_prefix: ""
            packages: ""
          - rid: linux-arm64
            cc_prefix: "aarch64-linux-gnu-"
            packages: gcc-aarch64-linux-gnu g++-aarch64-linux-gnu
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install cross-compiler
        if: ${{ matrix.packages != '' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ matrix.packages }}
      - name: Build via make
        working-directory: native
        run: |
          make all \
            RID=${{ matrix.rid }} \
            TARGET_OS=linux \
            CC=${{ matrix.cc_prefix }}gcc \
            CXX=${{ matrix.cc_prefix }}g++ \
            AR=${{ matrix.cc_prefix }}ar \
            RANLIB=${{ matrix.cc_prefix }}ranlib \
            HOST_CC=cc \
            CROSS=${{ matrix.cc_prefix }}
      - name: Stage artifacts
        working-directory: native
        run: |
          set -euo pipefail
          mkdir -p ../artifacts/${{ matrix.rid }}
          for f in lua51 lua52 lua53 lua54 lua55 luau luajit; do
            cp build/${f}/${{ matrix.rid }}/lib${f}.so ../artifacts/${{ matrix.rid }}/
          done
      - uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.rid }}
          path: artifacts/${{ matrix.rid }}/

  build-macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: osx-x64
            arch: x86_64
          - rid: osx-arm64
            arch: arm64
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Build via make
        working-directory: native
        run: |
          make all \
            RID=${{ matrix.rid }} \
            TARGET_OS=macos \
            CC=clang \
            CXX=clang++ \
            AR=ar \
            RANLIB=ranlib \
            CFLAGS_EXTRA="-arch ${{ matrix.arch }}" \
            LDFLAGS_EXTRA="-arch ${{ matrix.arch }}" \
            HOST_CC=cc
      - name: Stage artifacts
        working-directory: native
        run: |
          set -euo pipefail
          mkdir -p ../artifacts/${{ matrix.rid }}
          for f in lua51 lua52 lua53 lua54 lua55 luau luajit; do
            cp build/${f}/${{ matrix.rid }}/lib${f}.dylib ../artifacts/${{ matrix.rid }}/
          done
      - uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.rid }}
          path: artifacts/${{ matrix.rid }}/

  create-pr:
    needs: [build-windows, build-linux, build-macos]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    env:
      BRANCH: automate/${{ github.run_id }}-${{ github.run_attempt }}-native
    steps:
      - uses: actions/checkout@v4
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Configure git
        run: |
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
      - name: Create branch
        run: git checkout -b "${BRANCH}"
      - name: Place artifacts under runtimes/
        run: |
          set -euo pipefail

          # flavor -> Runtime.{Display} directory suffix.
          declare -A DISPLAY=(
            [lua51]=Lua51 [lua52]=Lua52 [lua53]=Lua53 [lua54]=Lua54 [lua55]=Lua55
            [luau]=Luau [luajit]=LuaJit
          )

          for flavor in "${!DISPLAY[@]}"; do
            display="${DISPLAY[$flavor]}"
            base="src/NuLua.Runtime.${display}/runtimes"
            for rid in win-x64 win-arm64 linux-x64 linux-arm64 osx-x64 osx-arm64; do
              case "${rid}" in
                win-*)   filename="${flavor}.dll" ;;
                osx-*)   filename="lib${flavor}.dylib" ;;
                linux-*) filename="lib${flavor}.so" ;;
              esac
              src="artifacts/native-${rid}/${filename}"
              dest="${base}/${rid}/native/${filename}"
              if [ -f "${src}" ]; then
                mkdir -p "$(dirname "${dest}")"
                cp -f "${src}" "${dest}"
              fi
            done
            git add "${base}"
          done

          git commit -m "automate: refresh all native binaries"
      - name: Push and open PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git push origin "${BRANCH}"
          gh pr create \
            --title "automate: refresh all native binaries" \
            --base main \
            --head "${BRANCH}" \
            --body "Refreshes all native binaries (lua51..lua55, luau, luajit) for win/linux/osx (x64+arm64) under \`src/NuLua.Runtime.{Display}/runtimes/\`."
