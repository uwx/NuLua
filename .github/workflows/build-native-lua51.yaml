name: Build-Native-Lua51

# Cross-compiles the lua51 cdylib for the six desktop RIDs and opens a PR that
# places the artifacts under src/NuLua.Runtime.Lua51/runtimes/{rid}/native/.

on:
  workflow_dispatch:

env:
  FLAVOR: lua51
  DISPLAY: Lua51

jobs:
  build-windows:
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            target: x86_64-pc-windows-msvc
          - rid: win-arm64
            target: aarch64-pc-windows-msvc
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Cargo build
        working-directory: native
        run: cargo build --release -p ${{ env.FLAVOR }} --target ${{ matrix.target }}
      - name: Stage artifact
        shell: bash
        working-directory: native
        run: |
          mkdir -p ../artifacts/${{ matrix.rid }}
          cp target/${{ matrix.target }}/release/${{ env.FLAVOR }}.dll ../artifacts/${{ matrix.rid }}/
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.FLAVOR }}-${{ matrix.rid }}
          path: artifacts/${{ matrix.rid }}/

  build-linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: linux-x64
            target: x86_64-unknown-linux-gnu
            packages: ""
            cc: gcc
          - rid: linux-arm64
            target: aarch64-unknown-linux-gnu
            packages: gcc-aarch64-linux-gnu
            cc: aarch64-linux-gnu-gcc
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install cross-compiler
        if: ${{ matrix.packages != '' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ matrix.packages }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Cargo build
        working-directory: native
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
          CC_aarch64_unknown_linux_gnu: aarch64-linux-gnu-gcc
        run: cargo build --release -p ${{ env.FLAVOR }} --target ${{ matrix.target }}
      - name: Stage artifact
        working-directory: native
        run: |
          mkdir -p ../artifacts/${{ matrix.rid }}
          cp target/${{ matrix.target }}/release/lib${{ env.FLAVOR }}.so ../artifacts/${{ matrix.rid }}/
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.FLAVOR }}-${{ matrix.rid }}
          path: artifacts/${{ matrix.rid }}/

  build-macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: osx-x64
            target: x86_64-apple-darwin
          - rid: osx-arm64
            target: aarch64-apple-darwin
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Cargo build
        working-directory: native
        run: cargo build --release -p ${{ env.FLAVOR }} --target ${{ matrix.target }}
      - name: Stage artifact
        working-directory: native
        run: |
          mkdir -p ../artifacts/${{ matrix.rid }}
          cp target/${{ matrix.target }}/release/lib${{ env.FLAVOR }}.dylib ../artifacts/${{ matrix.rid }}/
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.FLAVOR }}-${{ matrix.rid }}
          path: artifacts/${{ matrix.rid }}/

  create-pr:
    needs: [build-windows, build-linux, build-macos]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    env:
      BRANCH: automate/${{ github.run_id }}-${{ github.run_attempt }}-lua51
    steps:
      - uses: actions/checkout@v4
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Configure git
        run: |
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
      - name: Create branch
        run: git checkout -b "${BRANCH}"
      - name: Place artifacts under runtimes/
        env:
          DEST_BASE: src/NuLua.Runtime.${{ env.DISPLAY }}/runtimes
        run: |
          set -euo pipefail
          for rid in win-x64 win-arm64 linux-x64 linux-arm64 osx-x64 osx-arm64; do
            mkdir -p "${DEST_BASE}/${rid}/native"
          done

          # Windows
          for rid in win-x64 win-arm64; do
            src="artifacts/${FLAVOR}-${rid}/${FLAVOR}.dll"
            [ -f "$src" ] && cp -f "$src" "${DEST_BASE}/${rid}/native/${FLAVOR}.dll"
          done

          # Linux
          for rid in linux-x64 linux-arm64; do
            src="artifacts/${FLAVOR}-${rid}/lib${FLAVOR}.so"
            [ -f "$src" ] && cp -f "$src" "${DEST_BASE}/${rid}/native/lib${FLAVOR}.so"
          done

          # macOS
          for rid in osx-x64 osx-arm64; do
            src="artifacts/${FLAVOR}-${rid}/lib${FLAVOR}.dylib"
            [ -f "$src" ] && cp -f "$src" "${DEST_BASE}/${rid}/native/lib${FLAVOR}.dylib"
          done

          git add "${DEST_BASE}"
          git commit -m "automate: refresh ${FLAVOR} native binaries"
      - name: Push and open PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git push origin "${BRANCH}"
          gh pr create \
            --title "automate: refresh ${FLAVOR} native binaries" \
            --base main \
            --head "${BRANCH}" \
            --body "Refreshes ${FLAVOR} native binaries for win/linux/osx (x64+arm64) under \`src/NuLua.Runtime.${DISPLAY}/runtimes/\`."
